name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: OrderPaymentSystem_Test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 120s
        ports:
          - 9200:9200

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      ConnectionStrings__PostgresSQL: Host=localhost;Port=5432;Database=OrderPaymentSystem_Test;Username=postgres;Password=postgres
      RedisSettings__Url: localhost:6379
      ElasticConfiguration__Uri: http://localhost:9200
      JwtSettings__JwtKey: test-jwt-key-for-ci-pipeline
      AdminSettings__Login: admin
      AdminSettings__Password: admin123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit Tests
        run: dotnet test tests/UnitTests --no-build -c Release --verbosity normal

      - name: Architecture Tests
        run: dotnet test tests/Architecture --no-build -c Release --verbosity normal

      - name: Integration Tests
        run: dotnet test tests/Integration --no-build -c Release --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Test
